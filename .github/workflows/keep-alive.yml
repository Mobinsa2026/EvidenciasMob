# Mantiene despierto el proyecto de Supabase.
#
# Los proyectos del plan gratuito se pausan tras siete días sin peticiones y
# reactivarlos es manual. Un ping diario evita que eso pase durante vacaciones
# o periodos sin entregas.
#
# Configuración: en Settings → Secrets and variables → Actions → Variables,
# crear APP_URL con la URL pública de Railway (por ejemplo
# https://evidencias.up.railway.app). Sin esa variable el job no hace nada.

name: Mantener la base despierta

on:
  schedule:
    # 14:00 UTC ≈ 8:00 AM en Chihuahua.
    - cron: '0 14 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar /api/salud
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          # El campo "Value" de GitHub es un textarea: es fácil que se cuele un
          # salto de línea o un espacio al pegar la URL, y curl responde con
          # "URL malformed" sin decir por qué. Se limpia antes de usarla.
          url=$(printf '%s' "$APP_URL" | tr -d '[:space:]' | sed 's:/*$::')

          if [ -z "$url" ]; then
            echo "Falta la variable APP_URL; no hay nada que consultar."
            exit 0
          fi

          case "$url" in
            http://*|https://*) ;;
            *)
              echo "APP_URL debe empezar con https:// — llegó: '$url'"
              exit 1
              ;;
          esac

          echo "Consultando $url/api/salud"
          codigo=$(curl -sS --max-time 30 -o respuesta.json -w '%{http_code}' "$url/api/salud")

          echo "HTTP $codigo"
          cat respuesta.json || true
          echo

          # Un 503 significa que la base no respondió: conviene enterarse.
          if [ "$codigo" != "200" ]; then
            echo "La aplicación no respondió correctamente."
            exit 1
          fi

          echo "La base está despierta."
